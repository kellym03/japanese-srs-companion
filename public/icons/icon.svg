<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primary-grad)" stroke-width="3" stroke-opacity="0.6" />

  <!-- Japanese Torii / Gate Accent Ring -->
  <circle cx="256" cy="240" r="148" fill="#030712" fill-opacity="0.6" stroke="url(#glow-grad)" stroke-width="4" filter="url(#shadow)" />

  <!-- Kanji: 習 (To Learn/Practice) with stylized SRS Crown & Book -->
  <!-- Modern Geometric Kanji Representation of 語 / 習 / 日本語 SRS -->
  <g fill="none" stroke="url(#primary-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Horizontal Bar (Torii Beam) -->
    <path d="M 140 160 L 372 160" />
    <path d="M 168 195 L 344 195" />
    <!-- Center Posts -->
    <path d="M 210 160 L 200 330" />
    <path d="M 302 160 L 312 330" />
    <!-- Center Kanji Stroke: 日 -->
    <rect x="220" y="215" width="72" height="75" rx="6" stroke="url(#glow-grad)" stroke-width="12" fill="#042f2e" fill-opacity="0.3" />
    <path d="M 220 252 L 292 252" stroke="url(#glow-grad)" stroke-width="10" />
  </g>

  <!-- Bottom Badge: SRS Ribbon / Japanese Level Indicator -->
  <rect x="146" y="364" width="220" height="52" rx="26" fill="url(#primary-grad)" filter="url(#shadow)" />
  <text x="256" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    JAPANESE SRS
  </text>
</svg>
